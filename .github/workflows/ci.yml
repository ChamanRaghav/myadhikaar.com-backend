name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myadhikaar
          POSTGRES_PASSWORD: myadhikaar
          POSTGRES_DB: myadhikaar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U myadhikaar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://myadhikaar:myadhikaar@localhost:5432/myadhikaar_test?schema=public
      TEST_DATABASE_URL: postgresql://myadhikaar:myadhikaar@localhost:5432/myadhikaar_test?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm 11 understands the allowScripts list in package.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run test:e2e
      - run: npm run build
